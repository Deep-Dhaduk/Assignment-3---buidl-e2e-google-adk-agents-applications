[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-assignment-suite"
version = "0.1.0"
description = "Five end-to-end Google ADK applications for Assignment 3"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk>=1.20,<2",
  "mcp>=1.20,<2",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "ruff>=0.14,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["assignment*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
exclude = ["examples/review_targets", "artifacts", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
